
name: Production Build and Semgrep Security Scan

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout production code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Configure Java
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build application
      - name: Build application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 4. Install Semgrep
      - name: Install Semgrep
        run: python3 -m pip install semgrep

      # 5. Generate security report
      - name: Run Semgrep scan
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output semgrep-report.json

          python3 semgrep_to_html.py

          echo "Production Semgrep scan completed."

      # 6. Send findings to Semgrep dashboard
      - name: Upload findings to Semgrep dashboard
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep ci

      # 7. Upload reports to GitHub Actions
      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-semgrep-reports
          path: |
            semgrep-report.json
            semgrep-report.html
          if-no-files-found: warn
